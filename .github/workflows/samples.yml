name: Samples

on:
  push:
    branches: [main]
    paths:
      - "binder_cover.py"
      - "fonts/**"
      - "scripts/generate_samples.py"
      - ".github/workflows/samples.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "binder_cover.py"
      - "fonts/**"
      - "scripts/generate_samples.py"
      - ".github/workflows/samples.yml"
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install a CJK font (for Japan-exclusive set names)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements.txt

      # PRs (including from forks, which can't push here anyway) just verify generation
      # still works and let a reviewer download the result -- they never touch samples/.
      # A push to main writes into samples/ and opens a PR with the diff (main is
      # protected -- direct pushes aren't possible even for github-actions[bot]).
      - name: Generate samples into a scratch dir (PRs -- does not touch samples/)
        if: github.event_name != 'push'
        run: python scripts/generate_samples.py --output-dir generated-samples

      - name: Upload generated samples (PRs only)
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: generated-samples
          path: generated-samples/
          if-no-files-found: warn

      - name: Generate samples into samples/ (push to main only)
        if: github.event_name == 'push'
        run: python scripts/generate_samples.py

      - name: Open a PR with regenerated samples (push to main only)
        if: github.event_name == 'push'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: regenerate samples"
          title: "Regenerate samples"
          body: >
            Auto-generated by the Samples workflow after a change to
            `binder_cover.py`, `fonts/`, or `scripts/generate_samples.py`
            landed on `main`. Review the image diff before merging.
          branch: auto/regenerate-samples
          add-paths: samples/
          delete-branch: true
